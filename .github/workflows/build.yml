name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:
    types: [ checks_requested ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  pull-requests: write
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        java:
          - 21
          - 25
          - 26
        include:
          - java: 21
            codecov: true
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Build and Verify
        run: make ci

      - name: Publish test results
        uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() && github.event.pull_request.head.repo.fork != true }}
        with:
          report_paths: '**/target/*-reports/TEST-*.xml'
          check_name: Test Report (JDK ${{ matrix.java }})
          detailed_summary: true
          flaky_summary: true
          include_passed: false
          fail_on_failure: true
          require_tests: true
          comment: true
          job_summary: true

      - name: Publish coverage report
        uses: madrapps/jacoco-report@v1.8.0
        if: ${{ !cancelled() && github.event.pull_request.head.repo.fork != true }}
        with:
          paths: 'reports/target/site/jacoco-aggregate/jacoco.xml'
          title: Coverage Report (JDK ${{ matrix.java }})
          update-comment: ${{ github.event_name == 'pull_request' }}
          min-coverage-changed-files: 75
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload results to Codecov
        if: ${{ !cancelled() && matrix.codecov && github.event.pull_request.head.repo.fork != true }}
        uses: codecov/codecov-action@v7
        with:
          name: codecov-jdk${{ matrix.java }}
          files: 'reports/target/site/jacoco-aggregate/jacoco.xml'
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: tachyonmcp/tachyon

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.codecov && github.event.pull_request.head.repo.fork != true }}
        uses: codecov/codecov-action@v7
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload reports as artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports-jdk-${{ matrix.java }}
          path: |
            **/target/*-reports/**
            reports/target/site/jacoco-aggregate/
            **/spotbugsXml.xml
            **/target/revapi-report.txt

  examples-snapshot:
    strategy:
      fail-fast: false
      matrix:
        java:
          - 21
        example:
          - echo-kotlin
          - langchain4j-mcp
          - mcp-java
          - temporal
          - weather-mcp
          - weather-mcp-kotlin
          - weather-mcp-spring-boot

    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Install jar
        run: |
          make package

      - name: Verify examples
        working-directory: 'examples/${{ matrix.example }}'
        run: |
          ./mvnw verify -Dtachyon.version=1.0.0-SNAPSHOT --no-transfer-progress
          rm -rf ~/.m2/repository/dev/tachyonmcp

      - name: Publish test results
        uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() && github.event.pull_request.head.repo.fork != true }}
        with:
          report_paths: 'examples/${{ matrix.example }}/target/*-reports/TEST-*.xml'
          check_name: 'Test Report: ${{ matrix.example }} (JDK ${{ matrix.java }})'
          detailed_summary: true
          flaky_summary: true
          include_passed: false
          fail_on_failure: true
          require_tests: true
          comment: true
          job_summary: true

      - name: Upload reports as artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports-jdk-${{ matrix.java }}
          path: '**/target/*-reports/**'

