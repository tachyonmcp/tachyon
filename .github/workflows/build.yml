name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:
    types: [ checks_requested ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.java.version }})
    permissions:
      checks: write
      pull-requests: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        java:
          # Primary JDK: lint, coverage, revapi, SpotBugs, javadoc and the JMH gate.
          - version: 21
            distribution: temurin
            command: ci
            primary: true
          # Compatibility JDKs: compile + test only, no report or analysis plugins.
          - version: 25
            distribution: temurin
            command: ci-lite
            primary: false
          - version: 27
            distribution: zulu
            command: ci-lite
            primary: false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java.version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java.version }}
          distribution: ${{ matrix.java.distribution }}
          cache: maven

      - name: Build and Verify
        run: make ${{ matrix.java.command }}

      - name: Publish test results
        uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() && github.event.pull_request.head.repo.fork != true }}
        with:
          report_paths: '**/target/*-reports/TEST-*.xml'
          check_name: Test Report (JDK ${{ matrix.java.version }})
          detailed_summary: true
          flaky_summary: true
          include_passed: false
          fail_on_failure: true
          require_tests: true
          comment: true
          job_summary: true

      - name: Publish coverage report
        uses: madrapps/jacoco-report@v1.8.0
        if: ${{ !cancelled() && matrix.java.primary && github.event.pull_request.head.repo.fork != true }}
        with:
          paths: 'reports/target/site/jacoco-aggregate/jacoco.xml'
          title: Coverage Report (JDK ${{ matrix.java.version }})
          update-comment: ${{ github.event_name == 'pull_request' }}
          min-coverage-changed-files: 75
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload results to Codecov
        if: ${{ !cancelled() && matrix.java.primary && github.event.pull_request.head.repo.fork != true }}
        uses: codecov/codecov-action@v7
        with:
          name: codecov-jdk${{ matrix.java.version }}
          files: 'reports/target/site/jacoco-aggregate/jacoco.xml'
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: tachyonmcp/tachyon

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.java.primary && github.event.pull_request.head.repo.fork != true }}
        uses: codecov/codecov-action@v7
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload reports as artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports-jdk-${{ matrix.java.version }}
          path: |
            **/target/*-reports/**
            reports/target/site/jacoco-aggregate/
            **/spotbugsXml.xml
            **/target/revapi-report.txt

  # The starter compiles against whatever spring-boot.version resolves; run its tests
  # against the oldest supported Boot line too, so a 4.1-only API cannot slip in.
  spring-boot-compat:
    name: spring-boot (${{ matrix.spring-boot }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        spring-boot:
          - '4.0.8'
          - '4.1.1'
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Test starter against Spring Boot ${{ matrix.spring-boot }}
        run: >
          ./mvnw test -pl integrations/tachyon-spring-boot-starter -am
          -Dspring-boot.version=${{ matrix.spring-boot }}
          -Dspotbugs.skip -Dspotless.skip -Djacoco.skip=true

  # Build the SNAPSHOT artifacts once and share them, instead of running a full
  # `make package` inside each example job.
  snapshot-artifacts:
    name: snapshot-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Install SNAPSHOT jars
        run: make package

      - name: Upload SNAPSHOT repository
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-repository
          path: ~/.m2/repository/dev/tachyonmcp
          retention-days: 1

  examples-snapshot:
    name: examples-snapshot (${{ matrix.example }})
    needs: snapshot-artifacts
    permissions:
      checks: write
      pull-requests: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        example:
          - echo-kotlin
          - langchain4j-mcp
          - mcp-java
          - mcp-skills
          - temporal
          - weather-mcp
          - weather-mcp-kotlin
          - weather-mcp-spring-boot

    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Download SNAPSHOT repository
        uses: actions/download-artifact@v6
        with:
          name: snapshot-repository
          path: ~/.m2/repository/dev/tachyonmcp

      - name: Verify example
        working-directory: 'examples/${{ matrix.example }}'
        run: ./mvnw verify -Dtachyon.version=1.0.0-SNAPSHOT --no-transfer-progress

      - name: Publish test results
        uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() && github.event.pull_request.head.repo.fork != true }}
        with:
          report_paths: 'examples/${{ matrix.example }}/target/*-reports/TEST-*.xml'
          check_name: 'Test Report: ${{ matrix.example }} (SNAPSHOT)'
          detailed_summary: true
          flaky_summary: true
          include_passed: false
          fail_on_failure: true
          require_tests: true
          comment: true
          job_summary: true

      - name: Upload reports as artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          # Must be unique per job: upload-artifact rejects a name another job already uploaded.
          name: reports-example-${{ matrix.example }}
          path: 'examples/${{ matrix.example }}/target/*-reports/**'
