name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version to publish, for example `0.4.2`
        required: true
        type: string

permissions:
  contents: read

env:
  JAVA_VERSION: 21

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Release names arrive as untrusted input: keep them out of the shell and
      # accept only a semver-shaped tag.
      - name: Resolve release coordinates
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "release" ]; then
            tag_name="${RELEASE_TAG}"
          else
            tag_name="v${MANUAL_RELEASE_VERSION}"
          fi

          if ! printf '%s' "${tag_name}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "Refusing to release from unexpected tag: ${tag_name}" >&2
            exit 1
          fi

          release_version="${tag_name#v}"

          {
            echo "tag_name=${tag_name}"
            echo "release_version=${release_version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check out release tag
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          git checkout "refs/tags/${TAG_NAME}"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      # processAllModules reaches tachyon-bom, which has no parent by design.
      - name: Set release version in workspace
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: >
          ./mvnw clean versions:set
          -DnewVersion="${RELEASE_VERSION}"
          -DprocessAllModules=true
          -DgenerateBackupPoms=false

      - name: Publish release to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          # Reproducible jars: stamp with the tag's own commit time.
          source_date="$(git log -1 --format=%cI "refs/tags/${TAG_NAME}")"
          ./mvnw -P release,lint clean deploy \
            -Drevapi.skip=false \
            -Dproject.build.outputTimestamp="${source_date}"

      - name: Upload SBOM and reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: release-${{ steps.release.outputs.release_version }}
          path: |
            target/bom.*
            **/target/revapi-report.txt
