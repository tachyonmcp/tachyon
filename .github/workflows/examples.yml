name: Examples

# Examples build against the *published* Tachyon release, so they only need to re-run when an
# example changes — plus a weekly run to catch a release that broke them.
on:
  push:
    branches: [ main ]
    paths:
      - 'examples/**'
      - '.github/workflows/examples.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'examples/**'
      - '.github/workflows/examples.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  examples:
    name: examples (${{ matrix.example }})
    permissions:
      checks: write
      pull-requests: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        java:
          - 21
        example:
          - echo-kotlin
          - langchain4j-mcp
          - mcp-java
          - mcp-skills
          - temporal
          - weather-mcp
          - weather-mcp-kotlin
          - weather-mcp-spring-boot

    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Verify examples
        working-directory: examples/${{ matrix.example }}
        run: ./mvnw clean verify --no-transfer-progress

      - name: Publish test results
        uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() && github.event.pull_request.head.repo.fork != true }}
        with:
          report_paths: 'examples/${{ matrix.example }}/target/*-reports/TEST-*.xml'
          check_name: 'Test Report: ${{ matrix.example }} (JDK ${{ matrix.java }})'
          detailed_summary: true
          flaky_summary: true
          include_passed: false
          fail_on_failure: true
          require_tests: true
          comment: true
          job_summary: true
