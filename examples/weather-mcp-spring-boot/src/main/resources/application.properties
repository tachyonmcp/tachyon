spring.application.name=weather-mcp-spring-boot
spring.main.web-application-type=reactive
spring.threads.virtual.enabled=true
tachyon.name=weather-server
tachyon.version=1.0.0-SNAPSHOT
tachyon.host=127.0.0.1
tachyon.port=8080
# Actuator over HTTP on a separate WebFlux server; MCP stays on tachyon.port
server.address=127.0.0.1
server.port=8081
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
# OpenTelemetry: sample every MCP span, export traces, logs and OTLP metrics every 5 seconds
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.schedule-delay=5s
management.opentelemetry.logging.export.schedule-delay=5s
management.otlp.metrics.export.step=5s

