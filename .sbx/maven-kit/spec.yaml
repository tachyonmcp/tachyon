schemaVersion: "2"
kind: mixin
name: maven
version: "1"
description: Install Maven for Java builds.

setup:
  install:
    - command: |
        apt-get update && \
        apt-get install -y maven

permissions:
  network:
    allow:
      - ports.ubuntu.com:443
      - ports.ubuntu.com:80
      - download.docker.com:443
      - repo1.maven.org:443
      - repo.maven.apache.org
